<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitting a Function to Data · MAS1004</title>
<style>
:root{
  --surface:#fcfcfb; --panel:#ffffff; --ink:#0b0b0b; --sub:#52514e; --muted:#8a8985;
  --rule:#dedcd6; --rule2:#c4c2bb; --accent:#b3001b;
  --data:#2a78d6; --model:#eb6834; --resid:#1baf7a; --ok:#0ca30c; --bad:#d03b3b;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--ink);
  font:400 18px/1.45 Inter,Pretendard,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
button,input,select{font-family:inherit;font-size:inherit}
h1,h2,h3{margin:0;font-weight:600}
sup{font-size:.7em}

#topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:24px;flex-wrap:wrap;
  padding:10px 24px;background:rgba(252,252,251,.96);border-bottom:1px solid var(--rule);backdrop-filter:blur(6px);
}
.brand{font-size:1.2rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand span{display:block;font-size:.78rem;font-weight:500;color:var(--sub);letter-spacing:.01em}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{
  padding:8px 16px;border-radius:10px;border:1px solid var(--rule2);background:#fff;color:var(--sub);
  font-size:1rem;font-weight:600;cursor:pointer;transition:.12s;
}
.tab:hover{border-color:var(--ink);color:var(--ink)}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.tab b{font-weight:700;margin-right:6px;opacity:.6}
.tab.active b{opacity:.8}

main{max-width:1720px;margin:0 auto;padding:18px 24px 60px}
.stage{display:none}
.stage.active{display:block}
.head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:2px 0 14px}
.head h2{font-size:1.45rem}
.head .eq{font:600 1.15rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);border:1px solid var(--rule2);padding:7px 12px;border-radius:9px;background:#fff}
.head .eq i{font-style:normal;color:var(--model)}
.head .k{font-size:.95rem;color:var(--sub)}

.dsrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ds{
  padding:7px 14px;border-radius:999px;border:1px solid var(--rule2);background:#fff;color:var(--sub);
  font-size:.95rem;font-weight:600;cursor:pointer;
}
.ds:hover{border-color:var(--ink);color:var(--ink)}
.ds.active{border-color:var(--data);color:var(--data);background:#eef4fc}

.work{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
.work.wide{grid-template-columns:minmax(0,1fr) 560px}
@media(max-width:1180px){.work,.work.wide{grid-template-columns:1fr}}
.plots{display:grid;grid-template-columns:1fr;gap:14px}
.plots.split{grid-template-columns:1fr 1fr}
@media(max-width:980px){.plots.split{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:12px 14px 10px}
.card h3{font-size:.95rem;color:var(--sub);font-weight:600;margin-bottom:6px}
canvas{display:block;width:100%;touch-action:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:.88rem;color:var(--sub)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend .dot{width:10px;height:10px;border-radius:50%}
.legend .dash{background:repeating-linear-gradient(90deg,var(--muted) 0 4px,transparent 4px 7px)}

.side{display:flex;flex-direction:column;gap:14px}
.question{border:1px solid var(--rule);border-left:4px solid var(--data);border-radius:12px;padding:12px 16px;background:#fff;font-size:1.05rem}
.question .q{font-weight:600}
.question .row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.question input{width:130px;padding:8px 10px;border:1px solid var(--rule2);border-radius:9px;font-weight:600;font-size:1.1rem}
.question input:focus{outline:2px solid var(--data);outline-offset:1px}
.question .unit{color:var(--sub);font-size:.95rem}
.score{border:1px solid var(--rule);border-radius:12px;padding:12px 16px;background:#fff;transition:.2s}
.score.good{border-color:var(--ok);box-shadow:0 0 0 2px rgba(12,163,12,.18)}
.score .lbl{font-size:.88rem;color:var(--sub);font-weight:600}
.score .big{font-size:3rem;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.score .sm{font-size:.95rem;color:var(--sub)}
.score .sm b{color:var(--ink);font-weight:600}
.score.hidden{display:none}

.knobs{display:grid;grid-template-columns:1fr;gap:10px}
.knobs.two{grid-template-columns:1fr 1fr}
.knob{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--rule);border-radius:12px;background:#fff;outline:none;--kc:var(--model)}
.knob:focus{border-color:var(--ink)}
.knob.drag{border-color:var(--ink)}
.knob.sm{gap:8px;padding:6px 8px}
.kdial{width:84px;height:84px;flex:none;cursor:ns-resize;touch-action:none}
.knob.sm .kdial{width:62px;height:62px}
.kdial svg{width:100%;height:100%;display:block}
.k-track{fill:none;stroke:var(--rule);stroke-width:8;stroke-linecap:round}
.k-val{fill:none;stroke:var(--kc);stroke-width:8;stroke-linecap:round}
.k-face{fill:#fff;stroke:var(--rule2);stroke-width:1.5}
.k-ind{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.k-hub{fill:var(--ink)}
.kinfo{display:flex;flex-direction:column;gap:4px;min-width:0}
.klabel{font-size:1.05rem;font-weight:600;white-space:nowrap}
.klabel span{color:var(--muted);font-weight:500;margin-left:6px;font-size:.88em}
.knob.sm .klabel{font-size:.95rem}
.kvalrow{display:flex;align-items:center;gap:6px}
.kval{font:600 1.3rem/1 ui-monospace,SFMono-Regular,Menlo,monospace;min-width:5.6ch;text-align:right;font-variant-numeric:tabular-nums}
.knob.sm .kval{font-size:1.05rem;min-width:5ch}
.kstep{width:30px;height:30px;border-radius:8px;border:1px solid var(--rule2);background:#fff;font-size:1.1rem;line-height:1;cursor:pointer;color:var(--ink)}
.kstep:hover{border-color:var(--ink)}
.knob.sm .kstep{width:26px;height:26px;font-size:1rem}

.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  padding:10px 16px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;
  font-weight:600;font-size:1rem;cursor:pointer;transition:.12s;
}
.btn:hover{background:#333}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.ghost:hover{background:#f2f1ee}
.btn.auto{border-color:var(--accent);background:var(--accent)}
.btn.auto:hover{background:#8f0016}
.note{border:1px solid var(--rule);border-radius:12px;padding:11px 15px;background:#fff;font-size:.98rem;line-height:1.5}
.note.warn{border-left:4px solid var(--bad)}
.note.good{border-left:4px solid var(--ok)}
.note.hide{display:none}
.note b{font-weight:600}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.98rem}
.ctl select{padding:7px 10px;border:1px solid var(--rule2);border-radius:9px;background:#fff;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:9px;overflow:hidden}
.seg button{padding:7px 12px;border:none;background:#fff;color:var(--sub);font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule2)}
.seg button.on{background:var(--ink);color:#fff}

table.cost{border-collapse:collapse;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}
table.cost th,table.cost td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:right;white-space:nowrap}
table.cost th{color:var(--sub);font-weight:600}
table.cost th:first-child,table.cost td:first-child{text-align:left}
table.cost tr.now td{font-weight:600}
table.cost tr.far td{color:var(--bad)}
.tip{font-size:.85rem;color:var(--muted);margin-top:4px}
kbd{font:600 .8em ui-monospace,Menlo,monospace;border:1px solid var(--rule2);border-radius:5px;padding:1px 5px;background:#fff}
</style>
</head>

var _pts = {};

/* ---------------- models: linear in a set of basis functions ---------------- */

    names:['w₁','w₂','w₃','w₄','w₅','w₆','w₇','w₈'],
    subs:['sin(2x)','cos(3x)','eˣ/20','ln(x+4)','(x/3)⁴','(x/3)²','x/3','1'],

/* ---------------- grid search (brute force) ---------------- */
/* Evaluates every combination of N values per parameter, in row-major order.

function gridSearch(model, dsKey, specs, N){

/* ---------------- gradient descent (professor-only reveal) ---------------- */

  function toQ(p){
    var q = new Float64Array(k), acc = 0;
    for(j = 0; j < k; j++){ if(j === constIdx) continue; q[j] = p[j]*sd[j]; acc += p[j]*mu[j]; }
    if(constIdx >= 0) q[constIdx] = p[constIdx] + acc;
    return q;
  }
  function toP(q){
    var p = new Array(k), acc = 0;
    for(j = 0; j < k; j++){ if(j === constIdx) continue; p[j] = q[j]/sd[j]; acc += p[j]*mu[j]; }
    if(constIdx >= 0) p[constIdx] = q[constIdx] - acc;

  }

  var S = {steps:0, p:p0.slice(), loss:lossOf(dz, p0)};
  S.step = function(nSteps){
    for(var t = 0; t < nSteps; t++){
      for(j = 0; j < k; j++) grad[j] = 0;
      for(i = 0; i < n; i++){
        o = i*k;
        var yh = 0;
        for(j = 0; j < k; j++){
          var z = j === constIdx ? 1 : (D[o + j] - mu[j])/sd[j];
          yh += q[j]*z;
        }
        var e = 2*(yh - ys[i])/n;
        for(j = 0; j < k; j++){
          var z2 = j === constIdx ? 1 : (D[o + j] - mu[j])/sd[j];
          grad[j] += e*z2;
        }
      }
      for(j = 0; j < k; j++) q[j] -= lr*grad[j];
      S.steps++;
    }
    S.p = toP(q);
    S.loss = lossOf(dz, S.p);
    return S;

}

return {
  DATA_VERSION:DATA_VERSION, DATASETS:DATASETS, MODELS:MODELS,
  points:points, mysteryTruth:mysteryTruth, knobSpecs:knobSpecs,
  predict:predict, mse:mse, leastSquares:leastSquares,

  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  ctx.fillStyle = C.tick; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for(v = Math.ceil(xLo/xs)*xs; v <= xHi + 1e-9; v += xs){
    var px = Math.round(PX(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(px, m.t); ctx.lineTo(px, m.t + ph); ctx.stroke();
    ctx.fillText(fmt(v, decimalsOf(xs)), px, m.t + ph + 7);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(v = Math.ceil(yLo/ys)*ys; v <= yHi + 1e-9; v += ys){
    var py = Math.round(PY(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(m.l, py); ctx.lineTo(m.l + pw, py); ctx.stroke();
    ctx.fillText(fmt(v, decimalsOf(ys)), m.l - 8, py);
  }
  /* zero lines a shade darker, when inside */
  ctx.strokeStyle = C.axis;
  if(xLo < 0 && xHi > 0){ var zx = Math.round(PX(0)) + 0.5; ctx.beginPath(); ctx.moveTo(zx, m.t); ctx.lineTo(zx, m.t + ph); ctx.stroke(); }
  if(yLo < 0 && yHi > 0){ var zy = Math.round(PY(0)) + 0.5; ctx.beginPath(); ctx.moveTo(m.l, zy); ctx.lineTo(m.l + pw, zy); ctx.stroke(); }
  /* axes */
  ctx.beginPath(); ctx.moveTo(m.l + 0.5, m.t); ctx.lineTo(m.l + 0.5, m.t + ph + 0.5); ctx.lineTo(m.l + pw, m.t + ph + 0.5); ctx.stroke();
  /* axis labels */
  ctx.fillStyle = C.tick; ctx.font = '600 14px Inter, system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(ds.xLabel, m.l + pw/2, H - 12);
  ctx.save(); ctx.translate(16, m.t + ph/2); ctx.rotate(-Math.PI/2); ctx.fillText(ds.yLabel, 0, 0); ctx.restore();

  ctx.save();
  ctx.beginPath(); ctx.rect(m.l, m.t, pw, ph); ctx.clip();

  var yhat = null;
  if(S.model && S.params){
    yhat = function(x){ return RS.predict(S.model, S.params, x); };
  }
  /* residuals */
  if(yhat && S.showResid){
    ctx.strokeStyle = C.resid; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.9;
    pts.forEach(function(p){
      var x = PX(p[0]);
      ctx.beginPath(); ctx.moveTo(x, PY(p[1])); ctx.lineTo(x, PY(yhat(p[0]))); ctx.stroke();
    });
    ctx.globalAlpha = 1;
  }
  /* data */
  var big = pts.length > 300;
  pts.forEach(function(p, i){
    var x = PX(p[0]), y = PY(p[1]), r = big ? 3 : 4.5;
    if(!big){ ctx.fillStyle = C.surface; ctx.beginPath(); ctx.arc(x, y, r + 2, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = C.data; ctx.globalAlpha = big ? 0.55 : 1;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  });
  /* model curve */
  if(yhat){
    ctx.strokeStyle = C.model; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    var n = 240, started = false;
    for(var i = 0; i <= n; i++){
      var x = xLo + (xHi - xLo)*i/n, y = yhat(x);
      if(!isFinite(y)){ started = false; continue; }
      var py2 = PY(y);
      if(py2 < -2000 || py2 > 4000){ started = false; continue; }
      if(!started){ ctx.moveTo(PX(x), py2); started = true; } else ctx.lineTo(PX(x), py2);
    }
    ctx.stroke();
  }
  /* query line, guess and prediction */
  if(ds.query !== null && ds.query !== undefined){
    var qx = PX(ds.query);
    ctx.strokeStyle = C.muted; ctx.lineWidth = 1.2; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(qx, m.t); ctx.lineTo(qx, m.t + ph); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '600 13px Inter, system-ui, sans-serif'; ctx.fillStyle = C.tick; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('x = ' + fmt(ds.query, ds.xFmt), qx + 6, m.t + 4);
    if(S.guess !== null && S.guess !== undefined && isFinite(S.guess)){
      var gy = PY(S.guess);
      ctx.fillStyle = C.surface; ctx.beginPath(); ctx.arc(qx, gy, 9, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = C.guess; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(qx, gy - 7); ctx.lineTo(qx + 7, gy); ctx.lineTo(qx, gy + 7); ctx.lineTo(qx - 7, gy); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = C.tick; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText('your guess ' + fmt(S.guess, ds.yFmt), qx - 12, gy);
    }
    if(yhat){
      var yq = yhat(ds.query), pq = PY(yq);
      ctx.fillStyle = C.surface; ctx.beginPath(); ctx.arc(qx, pq, 9, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = C.model; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(qx, pq, 6, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = '600 14px Inter, system-ui, sans-serif';
      ctx.fillText('ŷ = ' + fmt(yq, ds.yFmt), qx + 12, pq);
    }
  }
  ctx.restore();

  /* hover tooltip */
  if(S.hover !== null && S.hover !== undefined && pts[S.hover]){
    var hp = pts[S.hover], hx = PX(hp[0]), hy = PY(hp[1]);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hx, hy, 7, 0, Math.PI*2); ctx.stroke();
    var txt = 'x = ' + fmt(hp[0], ds.xFmt) + ',  y = ' + fmt(hp[1], ds.yFmt);
    if(yhat) txt += ',  ŷ = ' + fmt(yhat(hp[0]), ds.yFmt);
    ctx.font = '600 13px Inter, system-ui, sans-serif';
    var tw = ctx.measureText(txt).width + 16, th = 26;
    var tx = clamp(hx + 14, m.l, W - tw - 4), ty = clamp(hy - th - 10, 2, H - th - 2);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.rect(tx, ty, tw, th); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, tx + 8, ty + th/2);
  }
  return {PX:PX, PY:PY, m:m, pw:pw, ph:ph, W:W, H:H};
}
/* nearest data point to a pointer position, or null */
function nearestPoint(geom, pts, px, py){
  if(!geom) return null;
  var best = null, bd = 18*18;
  for(var i = 0; i < pts.length; i++){
    var dx = geom.PX(pts[i][0]) - px, dy = geom.PY(pts[i][1]) - py, d = dx*dx + dy*dy;
    if(d < bd){ bd = d; best = i; }
  }
  return best;
}
function attachHover(cv, getPts, getGeom, onHover){
  cv.addEventListener('pointermove', function(e){
    var r = cv.getBoundingClientRect();
    onHover(nearestPoint(getGeom(), getPts(), e.clientX - r.left, e.clientY - r.top));
  });
  cv.addEventListener('pointerleave', function(){ onHover(null); });
}

/* Heat map of the loss over a 2-parameter grid. H = {run, revealed, hand, specs, ds} */
function drawHeat(cv, Hs){
  var g = prep(cv, 0.86, 0.66);
  if(!g) return null;
  var ctx = g.ctx, W = g.W, Hh = g.H, run = Hs.run, specs = Hs.specs;
  var m = {l:70, r:18, t:14, b:52};
  var pw = W - m.l - m.r, ph = Hh - m.t - m.b;
  var s0 = specs[0], s1 = specs[1];      /* param 0 = a on the x axis, param 1 = b on the y axis */
  var PX = function(a){ return m.l + (a - s0.min)/(s0.max - s0.min)*pw; };
  var PY = function(b){ return m.t + ph - (b - s1.min)/(s1.max - s1.min)*ph; };
  ctx.fillStyle = C.surface; ctx.fillRect(0,0,W,Hh);
  ctx.fillStyle = '#f4f3f0'; ctx.fillRect(m.l, m.t, pw, ph);

  if(run && run.heat){
    var N = run.N, heat = run.heat, shown = Math.min(Hs.revealed, run.count);
    /* log scale between the smallest and the largest loss computed so far */
    var lo = Infinity, hi = -Infinity, c;
    for(c = 0; c < shown; c++){ var L = heat[c]; if(L < lo) lo = L; if(L > hi) hi = L; }
    var llo = Math.log(Math.max(lo, 1e-9)), lhi = Math.log(Math.max(hi, lo*1.0001 + 1e-9));
    var cw = pw/N, ch = ph/N;
    for(c = 0; c < shown; c++){
      var i0 = Math.floor(c/N), i1 = c % N;         /* i0: index of a, i1: index of b */
      var t = (Math.log(Math.max(heat[c], 1e-9)) - llo)/(lhi - llo);
      ctx.fillStyle = rampColor(t);
      var x = m.l + (N === 1 ? 0 : i0/(N - 1))*(pw - cw), y = m.t + ph - (N === 1 ? 0 : i1/(N - 1))*(ph - ch) - ch;
      ctx.fillRect(x, y, cw + 0.6, ch + 0.6);
    }
  }
  /* ticks */
  ctx.font = '13px Inter, system-ui, sans-serif'; ctx.fillStyle = C.tick; ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
  var xs = niceStep(s0.max - s0.min, 7), ys = niceStep(s1.max - s1.min, 6), v;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for(v = Math.ceil(s0.min/xs)*xs; v <= s0.max + 1e-9; v += xs){ var px = Math.round(PX(v)) + 0.5; ctx.beginPath(); ctx.moveTo(px, m.t + ph); ctx.lineTo(px, m.t + ph + 5); ctx.stroke(); ctx.fillText(fmt(v, decimalsOf(xs)), px, m.t + ph + 8); }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for(v = Math.ceil(s1.min/ys)*ys; v <= s1.max + 1e-9; v += ys){ var py = Math.round(PY(v)) + 0.5; ctx.beginPath(); ctx.moveTo(m.l - 5, py); ctx.lineTo(m.l, py); ctx.stroke(); ctx.fillText(fmt(v, decimalsOf(ys)), m.l - 8, py); }
  ctx.strokeStyle = C.axis; ctx.strokeRect(m.l + 0.5, m.t + 0.5, pw, ph);
  ctx.font = '600 14px Inter, system-ui, sans-serif'; ctx.fillStyle = C.tick; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s0.name + ' (' + s0.sub + ')', m.l + pw/2, Hh - 10);
  ctx.save(); ctx.translate(16, m.t + ph/2); ctx.rotate(-Math.PI/2); ctx.fillText(s1.name + ' (' + s1.sub + ')', 0, 0); ctx.restore();

  /* hand fit: cross. grid best: ring */
  if(Hs.hand){
    var hx = PX(Hs.hand[0]), hy = PY(Hs.hand[1]);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hx - 8, hy - 8); ctx.lineTo(hx + 8, hy + 8); ctx.moveTo(hx - 8, hy + 8); ctx.lineTo(hx + 8, hy - 8); ctx.stroke();
  }
  if(run && run.best.p && run.count >= run.total){
    var bx = PX(run.best.p[0]), by = PY(run.best.p[1]);
    ctx.strokeStyle = C.model; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bx, by, 9, 0, Math.PI*2); ctx.stroke();
  }
  return {PX:PX, PY:PY};
}

function rateNow(){ return state.rate || 1e7; }
function fmtRate(r){ return r >= 1e6 ? (r/1e6).toPrecision(2) + ' million' : Math.round(r/1e4)*1e4 >= 1e4 ? (Math.round(r/1e4)*1e4).toLocaleString('en-US') : Math.round(r).toLocaleString('en-US'); }
function costTable(rows, current){
  var t = h('table',{class:'cost'});
  t.appendChild(h('thead',{},[h('tr',{},[
    h('th',{text:'Parameters k'}), h('th',{text:'Steps N'}), h('th',{html:'Evaluations N<sup>k</sup>'}), h('th',{text:'Time at ' + fmtRate(rateNow()) + ' per second'})
  ])]));

/* ---------------- auto fit (gradient descent animation, professor only) ---------------- */
function makeAuto(getModel, getDs, knobs, onDone, lrOf){
  var run = null, raf = 0, btn, info;
  btn = h('button',{class:'btn auto', type:'button', text:'Let the machine turn the knobs'});
  info = h('div',{class:'tip', text:''});
  function stop(){
    if(raf) cancelAnimationFrame(raf);
    raf = 0; run = null; btn.textContent = 'Let the machine turn the knobs';
  }
  function tick(){
    if(!run) return;
    run.step(2);
    run.p.forEach(function(v, j){ knobs[j].setExact(v, false); });
    info.textContent = 'step ' + run.steps + ', loss ' + fmtLoss(run.loss);
    onDone();
    if(run.steps >= 4000){ stop(); return; }
    raf = requestAnimationFrame(tick);
  }
  btn.addEventListener('click', function(){
    if(run){ stop(); return; }
    var p0 = knobs.map(function(k){ return k.value; });
    run = RS.gradientDescent(getModel(), getDs(), p0, lrOf ? lrOf() : 0.08);
    btn.textContent = 'Stop';
    tick();
  });
  var wrap = h('div',{class:'note', style:'border-left:4px solid var(--accent)'},[
    h('div',{style:'font-weight:600;margin-bottom:8px', text:'Professor only (?auto=1)'}), btn, info
  ]);
  return {el:wrap, stop:stop};
}

  var counter = h('div',{class:'score'});
  var result = h('div',{class:'note hide'});
  var costBox = h('div',{class:'note'});
  var chips = dsChips(function(){ load(); }, LINE_KEYS);
  root.appendChild(h('div',{class:'head'},[title, h('span',{class:'eq', html:'try every (a, b) on a grid, keep the smallest loss'})]));
  root.appendChild(chips);
  root.appendChild(h('div',{class:'work wide'},[
    h('div',{class:'plots split'},[
      h('div',{class:'card'},[h('h3',{text:'Data, your hand-fit line (orange), best grid line (dark)'}), cvPlot]),
      h('div',{class:'card'},[h('h3',{text:'Loss for every (a, b) on the grid. Light = small loss. × your hand fit, ○ grid best'}), cvHeat])
    ]),
    h('div',{class:'side'},[
      h('div',{class:'ctl'},[h('span',{text:'Steps per parameter'}), seg]),
      h('div',{class:'btns'},[runBtn, applyBtn]),
      counter, result, costBox
    ])
  ]));
  function ds(){ return DS[state.ds]; }
  function hand(){ return handOf(state.ds); }
  function drawAll(){
    var d = ds(), pts = RS.points(state.ds);
    var S = {ds:d, pts:pts, model:MODELS.line, params:hand(), guess:state.guess[state.ds], hover:hover};
    geomP = drawPlot(cvPlot, S);
    /* overlay the grid best as a second line */
    if(run && run.done && run.best.p && geomP){
      var ctx = cvPlot.getContext('2d'), g = geomP;
      ctx.save(); ctx.beginPath(); ctx.rect(g.m.l, g.m.t, g.pw, g.ph); ctx.clip();
      ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.setLineDash([7,5]);
      ctx.beginPath(); ctx.moveTo(g.PX(d.xLo), g.PY(RS.predict(MODELS.line, run.best.p, d.xLo))); ctx.lineTo(g.PX(d.xHi), g.PY(RS.predict(MODELS.line, run.best.p, d.xHi))); ctx.stroke();
      ctx.restore();
    }
    drawHeat(cvHeat, {run:run, revealed:revealed, hand:hand(), specs:d.knobs});
  }
  function refreshCost(){
    var d = ds();
    counter.innerHTML = '<div class="lbl">Loss evaluations</div><div class="big">' + (run ? fmtCount(Math.min(revealed, run.count)) : '0') + '</div>' +
      '<div class="sm">' + N + ' × ' + N + ' = <b>' + fmtCount(N*N) + '</b> combinations of (a, b)</div>';
    var hl = RS.mse(MODELS.line, state.ds, hand());
    costBox.innerHTML = '';
    costBox.appendChild(h('div',{style:'margin-bottom:6px', html:'Your hand fit: a = ' + fmtP(hand()[0], d.knobs[0].step) + ', b = ' + fmtP(hand()[1], d.knobs[1].step) + ', loss <b>' + fmtLoss(hl) + '</b>'}));
    costBox.appendChild(costTable([[2,10],[2,30],[2,100],[2,1000]], [2, N]));
    costBox.appendChild(h('div',{class:'tip', text:'Time is projected from the speed measured on this computer during the last run.'}));
  }
  function finish(){
    var d = ds(), hl = RS.mse(MODELS.line, state.ds, hand());
    result.classList.remove('hide');
    var better = run.best.loss <= hl;
    result.className = 'note ' + (better ? 'good' : 'warn');
    result.innerHTML = '<b>Best on the grid:</b> a = ' + fmtP(run.best.p[0], d.knobs[0].step) + ', b = ' + fmtP(run.best.p[1], d.knobs[1].step) + ', loss <b>' + fmtLoss(run.best.loss) + '</b><br>' +
      fmtCount(run.total) + ' evaluations computed in ' + humanTime(run.computeMs/1000) + '. ' +
      (better ? 'The grid beat or matched your hand fit (' + fmtLoss(hl) + ').' : 'Your hand fit (' + fmtLoss(hl) + ') is still better: this grid is too coarse and skipped the best (a, b).');
    applyBtn.disabled = false;
  }
  function animate(){
    var elapsed = (performance.now() - revealStart)/1000, dur = 1.4;
    revealed = Math.min(run.total, Math.floor(run.total*Math.min(1, elapsed/dur)));
    refreshCost(); drawAll();
    if(revealed < run.total){ raf = requestAnimationFrame(animate); }
    else { raf = 0; finish(); }
  }
  runBtn.addEventListener('click', function(){
    if(raf) cancelAnimationFrame(raf);
    var d = ds();
    run = RS.gridSearch(MODELS.line, state.ds, d.knobs, N);
    while(!run.step(50)){}
    state.rate = Math.max(state.rate, run.total/Math.max(run.computeMs/1000, 1e-6));
    revealed = 0; revealStart = performance.now(); result.classList.add('hide'); applyBtn.disabled = true;
    animate();
  });
  applyBtn.addEventListener('click', function(){
    if(!run || !run.best.p) return;
    state.hand[state.ds] = run.best.p.slice();
    noteBest(state.ds + '|line', run.best.loss);
    refreshCost(); drawAll();
  });
  attachHover(cvPlot, function(){ return RS.points(state.ds); }, function(){ return geomP; }, function(i){ hover = i; drawAll(); });
  function load(){
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    title.textContent = ds().name;
    run = null; revealed = 0; result.classList.add('hide'); applyBtn.disabled = true;
    chips.sync(); refreshCost(); drawAll();
  }
  return {el:root, show:load, resize:drawAll};
}

/* ---------- Tab 4: More terms ---------- */
function tab4(){
  var root = h('section',{class:'stage', id:'stage4'});
  var DSK = 'study', d = DS[DSK];
  var modelKey = 'line';
  var title = h('h2',{text:d.name}), eq = h('span',{class:'eq', html:''}), kEl = h('span',{class:'k', text:''});
  var cv = h('canvas'), geom = null, hover = null;
  var knobs = [], knobBox = h('div',{class:'knobs'});
  var score = h('div',{class:'score'});
  var seg = h('div',{class:'seg'});
  ['line','quad','cubic'].forEach(function(mk){
    var b = h('button',{type:'button', text:MODELS[mk].label + ' (' + MODELS[mk].k + ')', class:mk === modelKey ? 'on' : ''});
    b.addEventListener('click', function(){ modelKey = mk; seg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); }); build(); update(); });
    seg.appendChild(b);
  });
  var N = 10, nseg = h('div',{class:'seg'});
  [10, 20, 30].forEach(function(n){
    var b = h('button',{type:'button', text:String(n), class:n === N ? 'on' : ''});
    b.addEventListener('click', function(){ N = n; nseg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); }); refreshCost(); });
    nseg.appendChild(b);
  });
  var runBtn = h('button',{class:'btn', type:'button', text:'Run the grid search'});
  var counter = h('div',{class:'score'});
  var result = h('div',{class:'note hide'});
  var costBox = h('div',{class:'note'});
  var resetBtn = h('button',{class:'btn ghost', type:'button', text:'Reset knobs'});
  var auto = null, run = null, raf = 0;
  var side = h('div',{class:'side'},[
    h('div',{class:'ctl'},[h('span',{text:'Model'}), seg]),
    knobBox, h('div',{class:'btns'},[resetBtn]), score,
    h('div',{class:'ctl'},[h('span',{text:'Grid steps per parameter'}), nseg, runBtn]),
    counter, result, costBox
  ]);
  root.appendChild(h('div',{class:'head'},[title, eq, kEl]));
  root.appendChild(h('div',{class:'work'},[
    h('div',{class:'plots'},[h('div',{class:'card'},[h('h3',{text:'Data, your curve (orange), residuals (green)'}), cv,
      h('div',{class:'legend'},[h('span',{},[h('i',{class:'dot', style:'background:var(--data)'}),'data']), h('span',{},[h('i',{style:'background:var(--model)'}),'your model']), h('span',{},[h('i',{style:'background:var(--resid)'}),'residual y − ŷ'])])])]),
    side
  ]));
  function model(){ return MODELS[modelKey]; }
  function specs(){ return modelKey === 'line' ? d.knobs : RS.knobSpecs(model(), d); }
  function params(){ return knobs.map(function(k){ return k.value; }); }
  function draw(){ geom = drawPlot(cv, {ds:d, pts:RS.points(DSK), model:model(), params:params(), showResid:true, guess:state.guess[DSK], hover:hover}); }
  function update(){
    var p = params(), L = RS.mse(model(), DSK, p), best = noteBest(DSK + '|' + modelKey, L);
    var yq = RS.predict(model(), p, d.query);
    score.innerHTML = '<div class="lbl">Loss: mean squared error</div><div class="big">' + fmtLoss(L) + '</div>' +
      '<div class="sm">Best so far with this model <b>' + fmtLoss(best) + '</b> · at 20 hours the model predicts GPA <b>' + fmt(yq, 2) + '</b></div>';
    refreshCost(); draw();
  }
  function build(){
    var m = model(), sp = specs();
    knobBox.innerHTML = ''; knobs = [];
    knobBox.className = 'knobs' + (m.k > 2 ? ' two' : '');
    eq.innerHTML = m.eq; kEl.textContent = m.k + ' parameters';
    sp.forEach(function(spec){
      var kn = makeKnob(spec, update, m.k > 2);
      knobs.push(kn); knobBox.appendChild(kn.el);
    });
    if(AUTO_MODE){
      if(auto){ auto.stop(); side.removeChild(auto.el); }
      auto = makeAuto(model, function(){ return DSK; }, knobs, update, function(){ return modelKey === 'line' ? 0.2 : 0.15; });
      side.appendChild(auto.el);
    }
    run = null; result.classList.add('hide');
  }
  function refreshCost(){
    var m = model();
    counter.innerHTML = '<div class="lbl">Loss evaluations</div><div class="big">' + (run ? fmtCount(run.count) : '0') + '</div>' +
      '<div class="sm">' + N + '<sup>' + m.k + '</sup> = <b>' + fmtCount(Math.pow(N, m.k)) + '</b> combinations' + (run && run.computeMs ? ' · ' + humanTime(run.computeMs/1000) + ' so far' : '') + '</div>';
    costBox.innerHTML = '';
    costBox.appendChild(costTable([[2,100],[3,100],[4,10],[4,30],[4,100],[8,100],[12,100]], [m.k, N]));
    costBox.appendChild(h('div',{class:'tip', text:'Time is projected from the speed measured on this computer during the last run.'}));
  }
  function tick(){
    var done = run.step(40);
    state.rate = Math.max(state.rate, run.count/Math.max(run.computeMs/1000, 1e-6));
    refreshCost();
    if(!done){ raf = requestAnimationFrame(tick); return; }
    raf = 0;
    var sp = specs(), m = model();
    knobs.forEach(function(k, j){ k.setExact(run.best.p[j], false); });
    result.classList.remove('hide');
    result.className = 'note good';
    result.innerHTML = '<b>Best on the grid:</b> ' + run.best.p.map(function(v, j){ return m.names[j] + ' = ' + fmtP(v, sp[j].step); }).join(', ') +
      ', loss <b>' + fmtLoss(run.best.loss) + '</b><br>' + fmtCount(run.total) + ' evaluations in ' + humanTime(run.computeMs/1000) + '. The knobs are now set to it.';
    update();
  }
  runBtn.addEventListener('click', function(){
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    run = RS.gridSearch(model(), DSK, specs(), N);
    result.classList.add('hide');
    tick();
  });
  resetBtn.addEventListener('click', function(){ knobs.forEach(function(k){ k.setRaw(k.spec.init, false); }); update(); });
  attachHover(cv, function(){ return RS.points(DSK); }, function(){ return geom; }, function(i){ hover = i; draw(); });
  build();
  return {el:root, show:function(){ update(); }, resize:draw, hide:function(){ if(auto) auto.stop(); if(raf){ cancelAnimationFrame(raf); raf = 0; } }};
}

/* ---------- Tab 5: Mystery function ---------- */
function tab5(){
  var root = h('section',{class:'stage', id:'stage5'});
  var DSK = 'mystery', d = DS[DSK], m = MODELS.mystery;
  var title = h('h2',{text:d.name}), eq = h('span',{class:'eq', style:'font-size:.95rem', html:m.eq});
  var cv = h('canvas'), geom = null, hover = null;
  var knobs = [], knobBox = h('div',{class:'knobs two'});
  var score = h('div',{class:'score'});
  var costBox = h('div',{class:'note'});
  var resetBtn = h('button',{class:'btn ghost', type:'button', text:'Reset knobs'});
  var auto = null;
  var side = h('div',{class:'side'},[knobBox, h('div',{class:'btns'},[resetBtn]), score, costBox]);
  root.appendChild(h('div',{class:'head'},[title, h('span',{class:'k', text:'8 parameters. The true weights are hidden.'})]));
  root.appendChild(h('div',{style:'margin-bottom:12px'},[eq]));
  root.appendChild(h('div',{class:'work wide'},[
    h('div',{class:'plots'},[h('div',{class:'card'},[h('h3',{text:'Data, your curve (orange), residuals (green)'}), cv,
      h('div',{class:'legend'},[h('span',{},[h('i',{class:'dot', style:'background:var(--data)'}),'data']), h('span',{},[h('i',{style:'background:var(--model)'}),'your model']), h('span',{},[h('i',{style:'background:var(--resid)'}),'residual y − ŷ'])])])]),
    side
  ]));
  function params(){ return knobs.map(function(k){ return k.value; }); }
  function draw(){ geom = drawPlot(cv, {ds:d, pts:RS.points(DSK), model:m, params:params(), showResid:true, hover:hover}); }
  function update(){
    var L = RS.mse(m, DSK, params()), best = noteBest(DSK, L);
    score.innerHTML = '<div class="lbl">Loss: mean squared error</div><div class="big">' + fmtLoss(L) + '</div>' +
      '<div class="sm">Best so far <b>' + fmtLoss(best) + '</b> · the noise alone is about 0.006</div>';
    draw();
  }
  function refreshCost(){
    costBox.innerHTML = '';
    costBox.appendChild(h('div',{style:'margin-bottom:6px;font-weight:600', text:'Cost of a grid search for this model'}));
    costBox.appendChild(costTable([[8,10],[8,30],[8,100],[8,1000]], [8,100]));
    costBox.appendChild(h('div',{class:'tip', text:'With 10 steps per weight the grid points are about 1 apart, too coarse to land near the answer. The speed is the one measured in the earlier tabs.'}));
  }
  RS.knobSpecs(m, d).forEach(function(spec){
    var kn = makeKnob(spec, update, true);
    knobs.push(kn); knobBox.appendChild(kn.el);
  });
  if(AUTO_MODE){
    auto = makeAuto(function(){ return m; }, function(){ return DSK; }, knobs, update, function(){ return 0.06; });
    side.appendChild(auto.el);
  }
  resetBtn.addEventListener('click', function(){ knobs.forEach(function(k){ k.setRaw(k.spec.init, false); }); update(); });
  attachHover(cv, function(){ return RS.points(DSK); }, function(){ return geom; }, function(i){ hover = i; draw(); });
  return {el:root, show:function(){ refreshCost(); update(); }, resize:draw, hide:function(){ if(auto) auto.stop(); }};
}

/* ---------------- assemble ---------------- */
var defs = [
  {n:1, label:'Data', make:tab1},
  {n:2, label:'A line by hand', make:tab2},
  {n:3, label:'Brute force', make:tab3},
  {n:4, label:'More terms', make:tab4},
  {n:5, label:'Mystery function', make:tab5}
];
defs.forEach(function(t){
  var st = t.make();
  stages[t.n] = st;
  mainEl.appendChild(st.el);
  var b = h('button',{class:'tab', type:'button', html:'<b>' + t.n + '</b>' + t.label, onclick:function(){ select(t.n); }});
  b.dataset.n = t.n;
  tabsEl.appendChild(b);
});
function select(n){
  if(stages[active] && stages[active].hide) stages[active].hide();
  active = n;
  tabsEl.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', +b.dataset.n === n); });
  Object.keys(stages).forEach(function(k){ stages[k].el.classList.toggle('active', +k === n); });
  stages[n].show();
  try{ history.replaceState(null, '', location.pathname + location.search + '#tab=' + n); }catch(e){}
}
window.addEventListener('resize', function(){ if(stages[active].resize) stages[active].resize(); });
select(clamp(parseInt(QP.tab || '1', 10) || 1, 1, 5));
if(QP.ds && DS[QP.ds] && LINE_KEYS.indexOf(QP.ds) >= 0){ state.ds = QP.ds; stages[active].show(); }
})();
</script>
